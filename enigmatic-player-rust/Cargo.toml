[package]
name = "enigmatic-player"
version = "1.5.0"
edition = "2021"
description = "Enigmatic Player: a pixel-style terminal music player"
authors = ["Jamal Tiliouan"]

[dependencies]
ratatui = "0.28"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
lofty = "0.21"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
